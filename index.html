<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkWala</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold text-center mb-6">LinkWala: Website Links</h1>
    
    <div class="mb-6">
      <h2 class="text-xl font-semibold mb-2">Stored Links</h2>
      <ul id="links-list" class="list-disc pl-6"></ul>
    </div>

    <div class="mb-6">
      <h2 class="text-xl font-semibold mb-2">Add New Link</h2>
      <p class="text-gray-600 mb-2">To add a link, use the Telegram bot with the /add command.</p>
      <p class="text-gray-600">Interact with the bot at <a href="https://t.me/YourBotUsername" class="text-blue-500 underline">t.me/YourBotUsername</a>.</p>
    </div>
  </div>

  <script>
    async function fetchLinks() {
      const response = await fetch('/api/links');
      const links = await response.json();
      const linksList = document.getElementById('links-list');
      linksList.innerHTML = '';
      for (const [name, url] of Object.entries(links)) {
        const li = document.createElement('li');
        li.innerHTML = `<a href="${url}" class="text-blue-500 underline" target="_blank">${name}</a>`;
        linksList.appendChild(li);
      }
    }
    fetchLinks();
  </script>
</body>
</html>
